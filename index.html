<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  overflow-x:hidden;
}

.idg-compass-wrapper{
  position:relative;
  width:100%;
  max-width:900px;
  margin:auto;
  padding:30px 15px 40px;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#f8f3ef,#fff8fb);
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.idg-background-glow{
  position:absolute;
  width:300px;
  height:300px;
  background:radial-gradient(circle,#f4c0c9 0%, transparent 70%);
  top:-120px;
  right:-100px;
  opacity:.35;
  pointer-events:none;
}

.idg-header{
  text-align:center;
  margin-bottom:20px;
  position:relative;
  z-index:2;
}

.idg-header h1{
  font-size:38px;
  line-height:1.1;
  margin:10px 0 15px;
  font-weight:700;
  background:linear-gradient(90deg,#d89fbf,#ef7f69,#f2b15c);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.idg-header p{
  max-width:650px;
  margin:auto;
  font-size:15px;
  color:#5b4b53;
  line-height:1.6;
}

.idg-badge{
  display:inline-block;
  padding:8px 14px;
  border-radius:999px;
  background:#f3e4e0;
  color:#7b5c62;
  font-size:11px;
  letter-spacing:1px;
  font-weight:600;
}

.compass-container{
  position:relative;
  width:100%;
  max-width:420px;
  aspect-ratio:1/1;
  margin:20px auto;
}

.ring{
  position:absolute;
  border-radius:50%;
  border:2px solid rgba(222,165,177,.22);
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

.ring-1{
  width:100%;
  height:100%;
}

.ring-2{
  width:75%;
  height:75%;
}

.ring-3{
  width:52%;
  height:52%;
}

.compass-core{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:120px;
  height:120px;
  border-radius:50%;
  background:linear-gradient(145deg,#f7d6d8,#fff);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    0 0 25px rgba(232,154,173,.25),
    inset 0 0 20px rgba(255,255,255,.9);
  z-index:5;
  animation:pulse 4s infinite ease-in-out;
}

.core-glow{
  position:absolute;
  width:150px;
  height:150px;
  border-radius:50%;
  border:1px dashed rgba(226,151,162,.35);
  animation:spin 18s linear infinite;
}

.core-text{
  text-align:center;
  color:#5c3f48;
}

.core-text span{
  display:block;
  font-size:14px;
  opacity:.7;
}

.core-text strong{
  font-size:24px;
  font-weight:700;
}

.cardinal{
  position:absolute;
  width:58px;
  height:58px;
  border:none;
  border-radius:50%;
  cursor:pointer;
  font-size:14px;
  font-weight:700;
  color:#fff;
  transition:.3s ease;
  z-index:10;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
}

.cardinal:hover{
  transform:scale(1.08);
}

.north{
  top:0;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(135deg,#e7c8d3,#cba985);
}

.south{
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(135deg,#ef8f7e,#c86773);
}

.east{
  right:0;
  top:50%;
  transform:translateY(-50%);
  background:linear-gradient(135deg,#f4b45e,#ef8b62);
}

.west{
  left:0;
  top:50%;
  transform:translateY(-50%);
  background:linear-gradient(135deg,#d79ec1,#c67aa6);
}

.ne{
  top:16%;
  right:16%;
  background:linear-gradient(135deg,#f3c2be,#e58f89);
}

.nw{
  top:16%;
  left:16%;
  background:linear-gradient(135deg,#e6d5bf,#d8b9a0);
}

.se{
  bottom:16%;
  right:16%;
  background:linear-gradient(135deg,#f2a05c,#df7f66);
}

.sw{
  bottom:16%;
  left:16%;
  background:linear-gradient(135deg,#d998ba,#bf6e96);
}

.needle{
  position:absolute;
  width:6px;
  height:42%;
  background:linear-gradient(to bottom,#7f2d4d,#ef9d6c);
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  border-radius:999px;
  z-index:3;
  animation:rotateNeedle 8s ease-in-out infinite;
}

.needle::before{
  content:'';
  position:absolute;
  top:-12px;
  left:50%;
  transform:translateX(-50%);
  border-left:10px solid transparent;
  border-right:10px solid transparent;
  border-bottom:20px solid #7f2d4d;
}

.message-panel{
  max-width:700px;
  margin:15px auto 0;
  padding:22px;
  border-radius:18px;
  background:rgba(255,255,255,.78);
  backdrop-filter:blur(10px);
  box-shadow:0 10px 25px rgba(0,0,0,.06);
  text-align:center;
  animation:fadeIn .8s ease;
}

.message-panel h2{
  margin:0 0 10px;
  font-size:24px;
  color:#6d4451;
}

.message-panel p{
  margin:0;
  font-size:15px;
  line-height:1.7;
  color:#5d5154;
}

@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

@keyframes pulse{
  0%{transform:translate(-50%,-50%) scale(1);}
  50%{transform:translate(-50%,-50%) scale(1.03);}
  100%{transform:translate(-50%,-50%) scale(1);}
}

@keyframes rotateNeedle{
  0%{transform:translate(-50%,-50%) rotate(-25deg);}
  50%{transform:translate(-50%,-50%) rotate(25deg);}
  100%{transform:translate(-50%,-50%) rotate(-25deg);}
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@media(max-width:600px){

  .idg-header h1{
    font-size:30px;
  }

  .idg-header p{
    font-size:14px;
  }

  .compass-container{
    max-width:320px;
  }

  .cardinal{
    width:50px;
    height:50px;
    font-size:12px;
  }

  .compass-core{
    width:95px;
    height:95px;
  }

  .core-text strong{
    font-size:20px;
  }

  .message-panel h2{
    font-size:20px;
  }

  .message-panel p{
    font-size:14px;
  }
}

</style>
